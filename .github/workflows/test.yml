name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install raes==6.0.1
          # Fail here rather than letting the bridge tests skip.
          python3 -c "import raes, raes.language_service; print('raes', raes.__version__)"
      - name: Grammar tests
        run: npm run test:grammar
      - name: Cursor and bridge tests
        run: npm run test:python
      - name: Package without publishing
        run: npx --yes @vscode/vsce@4.0.0 package --out vscode-raes-sdl.vsix
